<footer>

  <div class="source">
    {% if token %}
    <a href="{{token|resolvePath}}" target="_blank"><img src="{{token|resolvePath}}" /></a>
    {% endif %}

    <div>
{% markdown -%}
{% if sourceFormatted %}**{{'Common.Source'|l}}:** {{sourceFormatted}}{% endif %}
**{{'Common.Location'|l}}:** {{locationFormatted|default: 'System'}}
{% endmarkdown %}
    </div>
  </div>

  {% if tags %}
  <div class="tags">
  {% for tag in tags %}
    <span class="tag">{{tag}}</span>
  {% endfor %}
  </div>
  {% endif %}
</footer>
